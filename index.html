<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kosin Time Stamp">
<meta name="theme-color" content="#0f766e">
<title>Kosin Time Stamp</title>

<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,'Segoe UI',Tahoma,sans-serif;color:#134e4a;
       background:linear-gradient(180deg,#0f766e 0%,#115e59 100%)}
  .wrap{max-width:440px;margin:0 auto;padding:28px 16px 40px}
  .card{background:#fff;border-radius:26px;padding:26px 20px 30px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  h1{margin:0;text-align:center;font-size:30px;color:#0f766e}
  .sub{text-align:center;color:#555;font-size:15px;margin:6px 0 16px}
  .who{text-align:center;font-size:15px;color:#555;margin-bottom:14px}
  .who b{color:#134e4a}
  .who a{color:#0f766e;margin-left:6px}
  #phoneBox{display:none;margin-bottom:14px}
  #phoneBox input{width:100%;font-size:22px;padding:12px;border:2px solid #99d5c9;border-radius:12px;text-align:center;letter-spacing:1px}
  .status{border:2px solid #0f766e;background:#e6f4f1;border-radius:16px;padding:14px;text-align:center;margin-bottom:22px}
  .status .main{font-size:19px;font-weight:bold}
  .status .main big{font-size:28px}
  .status .hint{font-size:14px;color:#2f6f68;margin-top:4px}
  #btn{display:block;width:72%;aspect-ratio:1/1;max-width:300px;margin:0 auto;border:0;border-radius:36px;
       background:linear-gradient(180deg,#14a993,#0e8a79);color:#fff;font-size:44px;font-weight:800;letter-spacing:3px;
       box-shadow:0 14px 0 #0b4f47,0 22px 30px rgba(0,0,0,.25);cursor:pointer}
  #btn:active{transform:translateY(8px);box-shadow:0 6px 0 #0b4f47,0 10px 16px rgba(0,0,0,.25)}
  #btn:disabled{background:#9ca3af;box-shadow:0 14px 0 #6b7280}
  #btn{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;line-height:1.2}
  #btn.small{font-size:26px;letter-spacing:0}
  #btn.done,#btn.done:disabled{background:linear-gradient(180deg,#22c55e,#16a34a);box-shadow:0 14px 0 #166534}
  #btn small{display:block;font-size:15px;font-weight:normal;margin-top:6px}
  .link{display:block;margin:18px auto 0;background:none;border:0;color:#0f766e;font-size:15px;text-decoration:underline}
  #msg{margin-top:22px;padding:14px;border-radius:12px;font-size:16px;line-height:1.5;display:none}
  .ok{background:#d1fae5;display:block!important}.warn{background:#fef3c7;display:block!important}.err{background:#fee2e2;display:block!important}
  .hist{background:#fff;border-radius:22px;padding:18px 16px;margin-top:18px}
  .hist h2{font-size:18px;margin:0 0 10px;color:#0f766e}
  details{border-top:1px solid #e5e7eb;padding:10px 2px}
  summary{font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  .badge{background:#0f766e;color:#fff;border-radius:12px;padding:1px 10px;font-size:14px}
  .item{display:flex;gap:10px;padding:8px 0 0;font-size:15px}
  .item .t{font-weight:bold;min-width:48px}
  .item .p{color:#444;flex:1}
  .muted{color:#888;font-size:13px}
  .months{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
  .months button{flex:none;border:2px solid #0f766e;background:#fff;color:#0f766e;border-radius:16px;padding:5px 12px;font-size:14px}
  .months button.on{background:#0f766e;color:#fff;font-weight:bold}
  .sum{background:#f0fdfa;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px;color:#134e4a}
  .calh{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:8px}
  .calh b{font-size:22px;color:#0f766e;min-width:160px;text-align:center}
  .calh button{border:0;background:none;font-size:30px;color:#0f766e;padding:0 12px;cursor:pointer}
  .calh button:disabled{opacity:.2}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
  .dw{font-size:14px;color:#555;padding:4px 0}.dw.sun{color:#dc2626}
  .c{padding:4px 0;cursor:pointer}
  .c span{display:inline-block;width:34px;height:34px;line-height:34px;border-radius:50%;font-size:15px}
  .c.today span{border:2px solid #0f766e;line-height:30px}
  .c.sel span{background:#0f766e;color:#fff;font-weight:bold}
  .dots{height:8px;display:flex;justify-content:center;gap:3px;margin-top:1px}
  .dots i,.legend i,.tl>i{display:inline-block;width:7px;height:7px;border-radius:50%}
  .d-shift{background:#f9a8d4}.d-in{background:#14b8a6}.d-one{background:#fdba74}
  .d-off{background:#93c5fd}.d-hol{background:#c084fc}.d-none{background:#e5e7eb}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:#666;margin:10px 0 8px}
  .legend i{margin-right:4px}
  .day{margin-top:10px;border-top:1px solid #e5e7eb;padding-top:12px}
  .dh{font-size:20px;font-weight:bold;margin-bottom:4px}
  .tl{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:15px}
  .tl>i{width:14px;height:14px;margin-top:3px;flex:none}
  .pl{color:#555;font-size:14px}
  .foot{text-align:center;color:rgba(255,255,255,.6);font-size:12px;margin-top:18px}
  .pin{display:none;margin:-6px 0 16px;background:#fff7ed;border:2px dashed #f59e0b;border-radius:14px;padding:12px;text-align:center;font-size:15px;line-height:1.5}
  .pin a{display:inline-block;margin-top:8px;background:#f59e0b;color:#fff;font-weight:bold;text-decoration:none;padding:10px 18px;border-radius:10px;font-size:17px}
</style></head><body><div class="wrap">
  <div class="card">
    <h1>Kosin Time Stamp</h1>
    <div class="sub">กดปุ่มด้านล่างเพื่อบันทึกเวลา (ระบบจะขอตำแหน่งของคุณ)</div>
    <div class="who" id="who"></div>
    <div id="phoneBox"><input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="ใส่เบอร์โทร 10 หลัก"></div>
    <div class="pin" id="pin"></div>
    <div class="status" id="status"><div class="main">กำลังโหลด...</div></div>
    <button id="btn" onclick="go()">SEND</button>
    <button id="nogps" class="link" style="display:none" onclick="send(null)">ส่งแบบไม่มีพิกัด (ไม่แนะนำ)</button>
    <div id="msg"></div>
  </div>
  <div class="hist" id="hist"></div>
  <div class="foot">KOSIN · HR-1.0</div>
</div>
<script>
  var API = 'https://script.google.com/macros/s/AKfycbxCRmL8V6EJfXZPiqunDdb8vQgbwsF7FYOngL0aQNsvI79rfTCqAPI9meKCCKNYcDzf_A/exec';
  var google = {script: {}};
  Object.defineProperty(google.script, 'run', {get: function () {
    var ok = function () {}, fail = function () {}, o = {
      withSuccessHandler: function (f) { ok = f; return o; },
      withFailureHandler: function (f) { fail = f; return o; }};
    ['checkin', 'history'].forEach(function (n) {
      o[n] = function () {
        fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({action: n, args: [].slice.call(arguments)})})
          .then(function (r) { return r.json(); })
          .then(function (j) { if (j.ok) ok(j.result); else fail(new Error(j.error)); })
          .catch(function () { fail(new Error('เชื่อมต่อไม่ได้ — ตรวจสัญญาณเน็ตแล้วลองใหม่')); });
      };
    });
    return o;
  }});
</script>
<script>
  var LS = {get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }};
  var phoneEl = document.getElementById('phone');
  var PRESET = (new URLSearchParams(location.search).get('p') || LS.get('lockedPhone') || '').replace(/\D/g, ''), EXEC = location.origin + location.pathname;
  if (PRESET) LS.set('lockedPhone', PRESET);  // เติมโดย doGet: เบอร์จากลิงก์ส่วนตัว
  phoneEl.value = PRESET;
  var devId = LS.get('deviceId');
  if (!devId) { devId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0; return (c == 'x' ? r : (r & 3 | 8)).toString(16); }); LS.set('deviceId', devId); }

  function el(id) { return document.getElementById(id); }
  function msg(cls, html) { var m = el('msg'); m.className = cls; m.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
  // เบอร์ล็อกตามลิงก์ส่วนตัว (?p=) — ไม่มีช่องให้แก้ ไม่มีปุ่มเปลี่ยน
  // ลิงก์หลัก (ไม่มี ?p=) ใช้แค่ "ลงทะเบียนครั้งแรก" → ยืนยันเบอร์ → พาไปลิงก์ส่วนตัวที่ล็อกแล้ว
  function phone() { return PRESET || phoneEl.value.replace(/\D/g, ''); }

  function showWho() {
    if (PRESET) {
      el('who').innerHTML = '🔒 เบอร์ <b>' + PRESET + '</b>';
      el('phoneBox').style.display = 'none';
      el('pin').style.display = 'none';
      return;
    }
    el('who').innerHTML = '<b>ลงทะเบียนครั้งแรก</b> — ใส่เบอร์โทรของคุณ แล้วกด SEND';
    el('phoneBox').style.display = 'block';
  }

  function askLock(ph) {
    var pin = el('pin');
    pin.style.display = 'block';
    pin.innerHTML = 'ยืนยันเบอร์ <b style="font-size:22px">' + ph + '</b> ใช่ไหม?'
      + '<br><span class="muted">เมื่อยืนยันแล้ว เบอร์นี้จะถูกล็อกไว้กับลิงก์ของคุณ แก้เองไม่ได้ (ถ้าผิด ติดต่อ HR)</span>'
      + '<br><a href="' + EXEC + '?p=' + ph + '">🔒 ยืนยันและล็อกเบอร์</a>'
      + '<br><span class="muted">หน้าที่เปิดขึ้นมา ให้<b>เพิ่มลงหน้าจอหลัก</b> แล้วใช้ไอคอนนั้นเช็กอินทุกวัน<br>'
      + 'iPhone: ปุ่มแชร์ ⬆️ → เพิ่มไปยังหน้าจอโฮม · Android: ⋮ → เพิ่มลงในหน้าจอหลัก</span>';
    msg('', '');
  }

  function device() {
    var ua = navigator.userAgent, os = '', model = '', br = '';
    var m = ua.match(/Android\s([\d.]+)/);
    if (m) os = 'Android ' + m[1].split('.')[0];
    else if (/iPhone|iPad|iPod/.test(ua)) { os = 'iOS'; model = /iPad/.test(ua) ? 'iPad' : 'iPhone'; }
    else if (/Windows/.test(ua)) os = 'Windows'; else if (/Mac OS/.test(ua)) os = 'macOS';
    m = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\sBuild|\))/);
    if (m && m[1] !== 'K') model = m[1];
    br = /EdgA?\//.test(ua) ? 'Edge' : /SamsungBrowser/.test(ua) ? 'Samsung' : /Line\//.test(ua) ? 'LINE'
       : /FBAN|FBAV/.test(ua) ? 'Facebook' : /CriOS|Chrome\//.test(ua) ? 'Chrome'
       : /Firefox|FxiOS/.test(ua) ? 'Firefox' : /Safari/.test(ua) ? 'Safari' : '';
    var gpu = '';
    try { var gl = document.createElement('canvas').getContext('webgl');
      var ext = gl.getExtension('WEBGL_debug_renderer_info');
      gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : ''; } catch (e) {}
    return {os: os, model: model, browser: br, gpu: gpu, deviceId: devId,
      screen: screen.width + '×' + screen.height + ' @' + (window.devicePixelRatio || 1),
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '', lang: navigator.language || '',
      cpu: navigator.hardwareConcurrency || '', ram: navigator.deviceMemory || ''};
  }

  function go() {
    var ph = phone();
    if (!/^0\d{9}$/.test(ph)) { msg('err', 'กรุณาใส่เบอร์โทร 10 หลัก แล้วกด SEND อีกครั้ง'); phoneEl.focus(); return; }
    if (!PRESET) { askLock(ph); return; }  // ลิงก์หลักไม่บันทึกเอง — ต้องยืนยัน/ล็อกเบอร์ก่อน
    btnState('busy');
    msg('warn', '⏳ กำลังหาตำแหน่ง GPS... (รอสักครู่ อย่าปิดหน้านี้)');
    if (!navigator.geolocation) { gpsFail({code: 0}); return; }
    navigator.geolocation.getCurrentPosition(function (p) { send(p.coords); }, gpsFail,
      {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
  }

  // ปุ่ม SEND 3 สถานะ: ปกติ / กำลังบันทึก (เทา) / บันทึกแล้ว (เขียว นับถอยหลังกันกดซ้ำ 10 วิ)
  var btnTimer = null;
  function btnState(s) {
    var b = el('btn');
    clearInterval(btnTimer);
    b.classList.remove('small', 'done');
    if (s === 'busy') {
      b.disabled = true; b.classList.add('small'); b.innerHTML = 'กำลังบันทึก…';
    } else if (s === 'done') {
      var n = 10;
      b.disabled = true; b.classList.add('small', 'done');
      var draw = function () { b.innerHTML = '✓ บันทึกแล้ว<small>กดได้อีกใน ' + n + ' วิ</small>'; };
      draw();
      btnTimer = setInterval(function () { if (--n <= 0) btnState('idle'); else draw(); }, 1000);
    } else {
      b.disabled = false; b.innerHTML = 'SEND';
    }
  }

  function gpsFail(e) {
    btnState('idle');
    el('nogps').style.display = 'block';
    var how = e.code === 1
      ? 'มือถือ<b>ไม่อนุญาต</b>ให้หน้านี้ใช้ตำแหน่ง<br>1) เปิด <b>ตำแหน่ง/Location</b> ในมือถือ<br>2) กดรูป 🔒 หน้าลิงก์ → สิทธิ์ → <b>ตำแหน่ง: อนุญาต</b><br>3) กด SEND ใหม่'
      : 'หาตำแหน่งไม่เจอ — ออกไปใกล้หน้าต่าง/ที่โล่ง เปิด Location และปิดโหมดประหยัดแบต แล้วกด SEND ใหม่';
    msg('err', '⚠️ ' + how);
  }

  function send(c) {
    var d = device();
    d.phone = phone();
    if (c) { d.lat = c.latitude; d.lng = c.longitude; d.acc = Math.round(c.accuracy); d.alt = c.altitude; }
    msg('warn', '⏳ กำลังบันทึก...');
    btnState('busy');  // รวมกรณีกด "ส่งแบบไม่มีพิกัด"
    google.script.run.withSuccessHandler(function (r) {
      el('nogps').style.display = 'none';
      msg('ok', '<b>✅ บันทึกแล้ว ' + r.time.slice(0, 5) + ' น.</b>' + (r.name ? ' · ' + esc(r.name) : '')
        + '<br>' + (r.gps ? '📍 ' + esc(r.place || 'บันทึกพิกัดเรียบร้อย') : '⚠️ ครั้งนี้ไม่มีพิกัด'));
      btnState('done');
      loadHistory();
    }).withFailureHandler(function (e) {
      btnState('idle');
      msg('err', '❌ บันทึกไม่สำเร็จ: ' + esc(e && e.message ? e.message : e) + '<br>ลองกดใหม่อีกครั้ง');
    }).checkin(d);
  }

  // ---- สถานะวันนี้ + ประวัติย้อนหลังรายวัน (กี่ครั้ง กี่โมง ที่ไหน) ----
  var DOW = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  function thDate(iso) {
    var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]);
    return DOW[d.getDay()] + ' ' + (+p[2]) + '/' + (+p[1]) + '/' + (+p[0] + 543);
  }
  function todayIso() {
    var n = new Date();
    return n.getFullYear() + '-' + ('0' + (n.getMonth() + 1)).slice(-2) + '-' + ('0' + n.getDate()).slice(-2);
  }
  function hm(t) { return t.slice(0, 5).replace(/^0/, ''); }
  function items(list) {
    return list.map(function (x) {
      var where = x.gps ? (x.place ? '📍 ' + esc(x.place) : '📍 มีพิกัด') : '⚠️ ไม่มีพิกัด';
      return '<div class="item"><span class="t">' + hm(x.t) + '</span><span class="p">' + where
        + (x.dup > 1 ? ' <span class="muted">(กดซ้ำ ' + x.dup + ' ครั้ง นับเป็น 1)</span>' : '') + '</span></div>';
    }).join('');
  }
  function setStatus(today) {
    var s = el('status');
    if (!today) {
      s.innerHTML = '<div class="main">ยังไม่ได้กดวันนี้</div><div class="hint">กดปุ่ม SEND เมื่อเข้างาน</div>';
    } else if (today.items.length === 1) {
      s.innerHTML = '<div class="main">✅ วันนี้กดเข้างานแล้วเมื่อ <big>' + hm(today.items[0].t) + ' น.</big></div>'
        + '<div class="hint">ไว้ตอนเลิกงานกดอีกครั้งเพื่อบันทึกออกงาน (กดซ้ำได้ ไม่มีปัญหา)</div>';
    } else {
      var n = today.items.length;
      s.innerHTML = '<div class="main">✅ วันนี้กดแล้ว <big>' + n + '</big> ครั้ง</div>'
        + '<div class="hint">เข้างาน ' + hm(today.items[0].t) + ' น. · ล่าสุด ' + hm(today.items[n - 1].t) + ' น.</div>';
    }
  }
  function loadHistory() {
    var ph = phone();
    if (!PRESET) {  // ลิงก์หลัก: ยังไม่ล็อกเบอร์ ยังไม่แสดงประวัติ
      el('status').innerHTML = '<div class="main">ใส่เบอร์โทรด้านบน แล้วกด SEND เพื่อลงทะเบียน</div>';
      el('hist').style.display = 'none';
      return;
    }
    el('hist').style.display = 'block';
    var month = selMonth, key = 'histm_' + ph + '_' + month;
    // แสดงประวัติที่จำไว้ในเครื่องทันที (เปิดแอปปุ๊บเห็นเลย) แล้วค่อยอัปเดตจากชีตตามหลัง
    var saved = null;
    try { saved = JSON.parse(LS.get(key) || 'null'); } catch (e) { saved = null; }
    if (saved) renderHist(saved, true);
    else el('hist').innerHTML = monthBar() + '<div class="muted">⏳ กำลังโหลดประวัติ...</div>';
    google.script.run.withSuccessHandler(function (days) {
      LS.set(key, JSON.stringify(days));
      if (month === selMonth) renderHist(days, false);  // ระหว่างรอ ผู้ใช้อาจกดไปเดือนอื่นแล้ว
    }).withFailureHandler(function (e) {
      if (!saved && month === selMonth) el('hist').innerHTML = monthBar()
        + '<div class="muted">โหลดประวัติไม่ได้: ' + esc(e && e.message ? e.message : e) + '</div>';
    }).history(ph, month);
  }

  // ---- ปฏิทินรายเดือน + รายละเอียดรายวัน (แบบแอปลงเวลา) ----
  // CAL = กะงาน/วันทำงาน/วันหยุด จาก config.json ของโปรแกรม (เติมตอนสร้างไฟล์)
  var CAL = {"start": "08:00", "end": "17:00", "brk": "60 นาที", "workdays": [1, 2, 3, 4, 5], "hol": {"2026-01-01": "วันขึ้นปีใหม่", "2026-01-02": "วันหยุดพิเศษ", "2026-03-03": "วันมาฆบูชา", "2026-04-06": "วันจักรี", "2026-04-13": "วันสงกรานต์", "2026-04-14": "วันสงกรานต์", "2026-04-15": "วันสงกรานต์", "2026-05-01": "วันแรงงานแห่งชาติ", "2026-05-04": "วันฉัตรมงคล", "2026-06-01": "ชดเชยวันวิสาขบูชา", "2026-06-03": "วันเฉลิมพระชนมพรรษาสมเด็จพระนางเจ้าสุทิดา", "2026-07-28": "วันเฉลิมพระชนมพรรษาพระบาทสมเด็จพระเจ้าอยู่หัว", "2026-07-29": "วันอาสาฬหบูชา", "2026-08-12": "วันแม่แห่งชาติ", "2026-10-13": "วันนวมินทรมหาราช", "2026-10-23": "วันปิยมหาราช", "2026-12-07": "วันหยุดชดเชย", "2026-12-10": "วันรัฐธรรมนูญ", "2026-12-31": "วันสิ้นปี"}};
  var MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var MONF = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม',
              'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var curMonth = todayIso().slice(0, 7), selMonth = curMonth, selDay = todayIso(), lastDays = [];
  function monthLabel(ym) { return MON[+ym.slice(5, 7) - 1] + ' ' + String(+ym.slice(0, 4) + 543).slice(-2); }
  function monthBar() {
    return '<div class="calh"><button onclick="shiftMonth(-1)">‹</button><b>' + MONF[+selMonth.slice(5, 7) - 1]
      + ' ' + (+selMonth.slice(0, 4) + 543) + '</b><button onclick="shiftMonth(1)"'
      + (selMonth >= curMonth ? ' disabled' : '') + '>›</button></div>';
  }
  function shiftMonth(k) {
    var y = +selMonth.slice(0, 4), m = +selMonth.slice(5, 7) + k;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    selMonth = y + '-' + ('0' + m).slice(-2);
    selDay = selMonth === curMonth ? todayIso() : selMonth + '-01';
    loadHistory();
  }
  function dayType(iso) {
    if (CAL.hol[iso]) return 'hol';
    var d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
    return CAL.workdays.indexOf(d.getDay()) >= 0 ? 'work' : 'off';
  }
  function renderHist(days, stale) {
    lastDays = days;
    var by = {}, total = 0, t = todayIso();
    days.forEach(function (x) { by[x.date] = x; total += x.items.length; });
    if (selMonth === curMonth) setStatus(by[t] || null);
    var y = +selMonth.slice(0, 4), m = +selMonth.slice(5, 7);
    var first = new Date(y, m - 1, 1).getDay(), nd = new Date(y, m, 0).getDate(), cells = '';
    for (var i = 0; i < first; i++) cells += '<div></div>';
    for (var dd = 1; dd <= nd; dd++) {
      var iso = selMonth + '-' + ('0' + dd).slice(-2), ty = dayType(iso), x = by[iso];
      var dots = '<i class="' + (ty === 'work' ? 'd-shift' : ty === 'hol' ? 'd-hol' : 'd-off') + '"></i>';
      if (x) dots += '<i class="' + (x.items.length === 1 && ty === 'work' ? 'd-one' : 'd-in') + '"></i>';
      cells += '<div class="c' + (iso === selDay ? ' sel' : '') + (iso === t ? ' today' : '') + '" data-d="' + iso
        + '" onclick="pickDay(this.dataset.d)"><span>' + dd + '</span><div class="dots">' + dots + '</div></div>';
    }
    el('hist').innerHTML = monthBar()
      + (stale ? '<div class="muted" style="text-align:center">⟳ กำลังอัปเดต</div>' : '')
      + '<div class="cal"><div class="dw sun">อา</div><div class="dw">จ</div><div class="dw">อ</div><div class="dw">พ</div>'
      + '<div class="dw">พฤ</div><div class="dw">ศ</div><div class="dw">ส</div>' + cells + '</div>'
      + '<div class="legend"><span><i class="d-shift"></i>วันทำงาน</span><span><i class="d-in"></i>บันทึกแล้ว</span>'
      + '<span><i class="d-one"></i>บันทึกครั้งเดียว</span><span><i class="d-off"></i>เสาร์-อาทิตย์</span>'
      + '<span><i class="d-hol"></i>วันหยุด</span></div>'
      + '<div class="sum">' + monthLabel(selMonth) + ' · มาทำงาน <b>' + days.length + '</b> วัน · กดรวม <b>'
      + total + '</b> ครั้ง</div><div id="dayd"></div>';
    renderDay();
  }
  function pickDay(iso) { selDay = iso; renderHist(lastDays, false); }
  function renderDay() {
    var x = null, t = todayIso(), ty = dayType(selDay), p = selDay.split('-');
    lastDays.forEach(function (d) { if (d.date === selDay) x = d; });
    var html = '<div class="dh">' + (+p[2]) + ' ' + MONF[+p[1] - 1] + ' ' + (+p[0] + 543) + '</div>';
    html += ty === 'work'
      ? '<div class="tl"><i class="d-shift"></i><div><b>กะทำงาน</b><br>🕗 ' + CAL.start + ' – ' + CAL.end
        + ' &nbsp;·&nbsp; 🍴 พัก ' + CAL.brk + '</div></div>'
      : '<div class="tl"><i class="' + (ty === 'hol' ? 'd-hol' : 'd-off') + '"></i><div><b>'
        + (ty === 'hol' ? 'วันหยุด · ' + esc(CAL.hol[selDay]) : 'วันหยุด (เสาร์-อาทิตย์)') + '</b></div></div>';
    if (x) {
      var n = x.items.length;
      x.items.forEach(function (it, i) {
        var lab = i === 0 ? 'บันทึกเข้า' : (i === n - 1 ? 'บันทึกออก' : 'ระหว่างวัน');
        html += '<div class="tl"><i class="d-in"></i><div><b>' + lab + '</b> ' + hm(it.t) + ' น.'
          + (it.dup > 1 ? ' <span class="muted">(กดซ้ำ ' + it.dup + ')</span>' : '')
          + '<br><span class="pl">' + (it.gps ? '📍 ' + esc(it.place || 'มีพิกัด') : '⚠️ ไม่มีพิกัด') + '</span></div></div>';
      });
      if (n === 1 && ty === 'work') {
        html += '<div class="tl"><i class="d-one"></i><div><b>' + (selDay === t ? 'รอบันทึกออก' : 'ไม่ได้บันทึกออก')
          + '</b></div></div>';
      }
    } else if (ty === 'work') {
      html += '<div class="tl"><i class="d-none"></i><div class="muted">'
        + (selDay > t ? 'ยังไม่ถึงวันนี้' : 'ไม่มีการกดจากแอป Kosin ในวันนี้') + '</div></div>';
    }
    el('dayd').innerHTML = '<div class="day">' + html + '</div>';
  }
  showWho();
  loadHistory();
</script></body></html>
