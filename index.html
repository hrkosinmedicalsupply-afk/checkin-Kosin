</style></head><body><div class="wrap">

  <div id="fx"><div class="sheet">
    <h3>✏️ ขอแก้ไขเวลา</h3><div class="muted" id="fxDay"></div>

<script>
  var API = 'https://script.google.com/macros/s/AKfycbxCRmL8V6EJfXZPiqunDdb8vQgbwsF7FYOngL0aQNsvI79rfTCqAPI9meKCCKNYcDzf_A/exec';
  var google = {script: {}};
  Object.defineProperty(google.script, 'run', {get: function () {
    var ok = function () {}, fail = function () {}, o = {
      withSuccessHandler: function (f) { ok = f; return o; },
      withFailureHandler: function (f) { fail = f; return o; }};
    ['checkin', 'history', 'myPhoto', 'verifyStaff', 'whoAmI', 'requestFix'].forEach(function (n) {
      o[n] = function () {
        // รอเกิน 45 วิ ถือว่าเน็ตค้าง → ยกเลิกแล้วให้หน้าแอปส่งใหม่ (รหัสคำขอเดิม ไม่บันทึกซ้ำ)
        var ac = window.AbortController ? new AbortController() : null;
        var tm = ac ? setTimeout(function () { ac.abort(); }, 45000) : 0;
        fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'},
          body: JSON.stringify({action: n, args: [].slice.call(arguments)}), signal: ac ? ac.signal : undefined})
          .then(function (r) { return r.json(); })
          .then(function (j) { clearTimeout(tm); if (j.ok) ok(j.result); else fail(new Error(j.error)); })
          .catch(function () { clearTimeout(tm); fail(new Error('เชื่อมต่อไม่ได้ — ตรวจสัญญาณเน็ตแล้วลองใหม่')); });
      };
    });
    return o;
  }});
</script>
<script>
  var BUILD = 'bae42cc44d';
  function checkUpdate() {
    try {
      fetch(location.pathname + '?_=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.text(); })
        .then(function (t) {
          var m = t.match(/var BUILD = '([0-9a-f]+)'/);
          if (!m || m[1] === BUILD) return;
          var key = 'upd_' + m[1];
          try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
          var q = new URLSearchParams(location.search); q.set('v', m[1]);
          location.replace(location.pathname + '?' + q.toString());
        }).catch(function () {});
    } catch (e) {}
  }
  checkUpdate();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkUpdate(); });
</script>
<script>
  var LS = {get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
            del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }};
  var phoneEl = document.getElementById('phone');
  var PRESET = (new URLSearchParams(location.search).get('p') || LS.get('lockedPhone') || '').replace(/\D/g, ''), EXEC = location.origin + location.pathname;
  if (PRESET) LS.set('lockedPhone', PRESET);  // เติมโดย doGet: เบอร์จากลิงก์ส่วนตัว
  phoneEl.value = PRESET;
  var devId = LS.get('deviceId');
  if (!devId) { devId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0; return (c == 'x' ? r : (r & 3 | 8)).toString(16); }); LS.set('deviceId', devId); }

  function el(id) { return document.getElementById(id); }
  function msg(cls, html) { var m = el('msg'); m.className = cls; m.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
  // เบอร์ล็อกตามลิงก์ส่วนตัว (?p=) — ไม่มีช่องให้แก้ ไม่มีปุ่มเปลี่ยน
  // ลิงก์หลัก (ไม่มี ?p=) ใช้แค่ "ลงทะเบียนครั้งแรก" → ยืนยันเบอร์ → พาไปลิงก์ส่วนตัวที่ล็อกแล้ว
  function phone() { return PRESET || phoneEl.value.replace(/\D/g, ''); }
  // ชื่อพนักงาน: มาจากไฟล์รายชื่อของ HR (ตอนยืนยันอีเมล+เบอร์) จำไว้ในเครื่อง
  var whoAsked = false;
  function myName() { return LS.get('myName_' + phone()) || ''; }
  function saveName(ph, n) { if (ph && n) LS.set('myName_' + ph, n); }
  function myEmail() { return el('em').value.trim().toLowerCase(); }

  function showWho() {
    if (PRESET) {
      var n = LS.get('myName_' + PRESET);
      el('who').innerHTML = (n ? '👤 <b>' + esc(n) + '</b><br>' : '') + '🔒 เบอร์ <b>' + PRESET + '</b>';
      el('phoneBox').style.display = 'none';
      el('nameBox').style.display = 'none';
      el('pin').style.display = 'none';
      if (!n && !whoAsked) {  // ยังไม่รู้ชื่อในเครื่องนี้ (เช่น ไอคอนบน iPhone) → ถามระบบครั้งเดียว
        whoAsked = true;
        google.script.run.withSuccessHandler(function (r) {
          if (r && r.name) { saveName(PRESET, r.name); showWho(); }
        }).withFailureHandler(function () {}).whoAmI(PRESET, device());
      }
      return;
    }
    el('who').innerHTML = '<b>ลงทะเบียนครั้งแรก</b> — ใส่อีเมลและเบอร์โทรที่แจ้ง HR ไว้ แล้วกด SEND';
    el('nameBox').style.display = 'block';
    el('phoneBox').style.display = 'block';
  }

  function askLock(ph, name) {
    saveName(ph, name);
    LS.set('email_' + ph, myEmail());  // ใช้ตอนกดครั้งแรก (ระบบตรวจซ้ำอีกรอบ) แล้วลบทิ้ง
    var pin = el('pin');
    pin.style.display = 'block';
    pin.innerHTML = '✅ พบในรายชื่อพนักงาน<br><b style="font-size:20px">' + esc(name || '') + '</b><br>เบอร์ <b style="font-size:22px">' + ph + '</b>'
      + '<br><span class="muted">เมื่อยืนยันแล้ว เบอร์นี้จะถูกล็อกไว้กับมือถือเครื่องนี้ แก้เองไม่ได้ (เปลี่ยนมือถือ ติดต่อ HR)</span>'
      + '<br><a href="' + EXEC + '?p=' + ph + '">🔒 ยืนยันและเริ่มใช้งาน</a>'
      + '<br><span class="muted">หน้าที่เปิดขึ้นมา ให้<b>เพิ่มลงหน้าจอหลัก</b> แล้วใช้ไอคอนนั้นเช็กอินทุกวัน<br>'
      + 'iPhone: ปุ่มแชร์ ⬆️ → เพิ่มไปยังหน้าจอโฮม · Android: ⋮ → เพิ่มลงในหน้าจอหลัก</span>';
    msg('', '');
  }

  // ลงทะเบียนครั้งแรก: ตรวจอีเมล + เบอร์กับรายชื่อพนักงานของ HR ก่อนล็อกเบอร์
  function verifyStaff(ph) {
    msg('warn', '⏳ กำลังตรวจกับรายชื่อพนักงาน...');
    google.script.run.withSuccessHandler(function (r) {
      askLock(ph, r.name);
    }).withFailureHandler(function (e) {
      msg('err', '❌ ' + esc(e && e.message ? e.message : 'ตรวจไม่สำเร็จ ลองใหม่อีกครั้ง'));
    }).verifyStaff(ph, myEmail());

    var show = function (b64) {
      phCache[id] = b64;
      im.src = 'data:image/jpeg;base64,' + b64; im.style.display = 'block';
      el('pvMsg').textContent = 'รูปตอนบันทึกเวลา';
    };
    if (phCache[id]) { show(phCache[id]); return; }
    google.script.run.withSuccessHandler(show).withFailureHandler(function (e) {
      el('pvMsg').textContent = '⚠️ ' + (e && e.message ? e.message : 'โหลดรูปไม่ได้ ลองใหม่อีกครั้ง');
    }).myPhoto(phone(), id, device());
  }
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('[data-ph]') : null;
    if (b) viewPhoto(b.getAttribute('data-ph'));
  });
  function setStatus(today) {
    var s = el('status');
    if (!today) {
      s.innerHTML = '<div class="main">ยังไม่ได้กดวันนี้</div><div class="hint">กดปุ่ม SEND เมื่อเข้างาน</div>';
    } else if (today.items.length === 1) {
      s.innerHTML = '<div class="main">✅ วันนี้กดเข้างานแล้วเมื่อ <big>' + hm(today.items[0].t) + ' น.</big></div>'
        + '<div class="hint">ไว้ตอนเลิกงานกดอีกครั้งเพื่อบันทึกออกงาน (กดซ้ำได้ ไม่มีปัญหา)</div>';
    } else {
      var n = today.items.length;
      s.innerHTML = '<div class="main">✅ วันนี้กดแล้ว <big>' + n + '</big> ครั้ง</div>'
        + '<div class="hint">เข้างาน ' + hm(today.items[0].t) + ' น. · ล่าสุด ' + hm(today.items[n - 1].t) + ' น.</div>';
    }
    if (today && today.r && today.r.late) s.innerHTML += '<div class="hint"><span class="rt y">สาย ' + mtxt(today.r.late) + '</span></div>';
  }
  // ---- ผลรายวันตามกฎบริษัท (คิดที่เซิร์ฟเวอร์ แบบเดียวกับรายงานของ HR) ----
  function mtxt(m) { return m >= 60 ? Math.floor(m / 60) + ' ชม. ' + (m % 60 ? (m % 60) + ' นาที' : '') : m + ' นาที'; }
  function resultTags(r) {
    if (!r) return '';
    var t = [];
    if (r.late) t.push('<span class="rt y">สาย ' + mtxt(r.late) + (r.forgot === 'in' ? ' (ลืมบันทึกเข้า)' : '') + '</span>');
    if (r.half) t.push('<span class="rt r">ออกก่อน ' + mtxt(r.early) + ' = ขาดครึ่งวัน</span>');
    else if (r.early) t.push('<span class="rt y">ออกก่อน ' + mtxt(r.early) + '</span>');
    if (r.forgot === 'out') t.push('<span class="rt y">ลืมบันทึกออก (นับถึง ' + CAL.end + ')</span>');
    if (r.ot) t.push('<span class="rt g">OT ' + r.otTxt + (r.work ? '' : ' (วันหยุด)') + '</span>');
    else if (r.noOt && !r.work) t.push('<span class="rt o">มาวันหยุด (ตำแหน่งนี้ไม่มี OT)</span>');
    if (!t.length && r.work && !r.pending) t.push('<span class="rt g">✅ ตรงเวลา</span>');
    return t.join(' ');
  }
  function loadHistory() {
    var ph = phone();
    if (!PRESET) {  // ลิงก์หลัก: ยังไม่ล็อกเบอร์ ยังไม่แสดงประวัติ
      el('status').innerHTML = '<div class="main">ใส่อีเมลและเบอร์โทรด้านบน แล้วกด SEND เพื่อลงทะเบียน</div>';
      el('hist').style.display = 'none';
      return;
    }
    el('hist').style.display = 'block';
    var month = selMonth, key = 'histm_' + ph + '_' + month;
    // แสดงประวัติที่จำไว้ในเครื่องทันที (เปิดแอปปุ๊บเห็นเลย) แล้วค่อยอัปเดตจากชีตตามหลัง
    var saved = null;
    try { saved = JSON.parse(LS.get(key) || 'null'); } catch (e) { saved = null; }
    if (saved) renderHist(saved, true);
    else el('hist').innerHTML = monthBar() + '<div class="muted">⏳ กำลังโหลดประวัติ...</div>';
    google.script.run.withSuccessHandler(function (days) {
      LS.set(key, JSON.stringify(days));
      if (month === selMonth) renderHist(days, false);  // ระหว่างรอ ผู้ใช้อาจกดไปเดือนอื่นแล้ว
    }).withFailureHandler(function (e) {
      if (!saved && month === selMonth) el('hist').innerHTML = monthBar()
        + '<div class="muted">โหลดประวัติไม่ได้: ' + esc(e && e.message ? e.message : e) + '</div>';
    }).history(ph, month);
  }

  // ---- ปฏิทินรายเดือน + รายละเอียดรายวัน (แบบแอปลงเวลา) ----
  // CAL = กะงาน/วันทำงาน/วันหยุด จาก config.json ของโปรแกรม (เติมตอนสร้างไฟล์)
  var CAL = {"start": "08:00", "end": "17:00", "brk": "60 นาที", "workdays": [1, 2, 3, 4, 5], "hol": {"2026-01-01": "วันขึ้นปีใหม่", "2026-01-02": "วันขึ้นปีใหม่", "2026-03-03": "วันมาฆบูชา", "2026-04-06": "วันจักรี", "2026-04-13": "วันสงกรานต์", "2026-04-14": "วันสงกรานต์", "2026-04-15": "วันสงกรานต์", "2026-05-01": "วันแรงงาน", "2026-05-04": "วันฉัตรมงคล", "2026-06-01": "หยุดชดเชยวันวิสาขบูชา", "2026-06-03": "วันเกิดราชินี", "2026-07-28": "วันเกิด ร.10", "2026-07-29": "วันอาสาฬหบูชา", "2026-08-12": "วันแม่", "2026-10-13": "วันสวรรคต ร.9", "2026-10-23": "วันปิยมหาราช", "2026-12-07": "หยุดชดเชยวันพ่อ", "2026-12-10": "วันรัฐธรรมนูญ", "2026-12-31": "วันสิ้นปี", "2027-01-01": "วันปีใหม่"}, "work": {"2026-01-17": "ประชุมใหญ่", "2026-02-21": "ประชุมเสาร์", "2026-03-28": "ประชุมไตรมาส", "2026-04-25": "ทำ 5ส", "2026-05-09": "ประชุมเสาร์", "2026-06-06": "ประชุมเสาร์", "2026-07-04": "ประชุมไตรมาส", "2026-08-01": "ประชุมเสาร์", "2026-08-22": "ทำ 5ส", "2026-09-05": "ประชุมเสาร์", "2026-10-03": "ประชุมไตรมาส", "2026-11-07": "ประชุมเสาร์", "2026-12-12": "ประชุมเสาร์", "2026-12-19": "ทำ 5ส และ check stock", "2027-01-16": "ประชุมใหญ่"}, "ot": "18:00", "field": {"bkk": ["09:00", "16:00"], "upc": ["08:30", "16:30"]}, "grace": 0.0, "window": 30.0, "forgotLate": 10.0, "halfMin": 60.0};
  var MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  var MONF = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม',
              'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  var curMonth = todayIso().slice(0, 7), selMonth = curMonth, selDay = todayIso(), lastDays = [];
  function monthLabel(ym) { return MON[+ym.slice(5, 7) - 1] + ' ' + String(+ym.slice(0, 4) + 543).slice(-2); }
  function monthBar() {
    return '<div class="calh"><button onclick="shiftMonth(-1)">‹</button><b>' + MONF[+selMonth.slice(5, 7) - 1]
      + ' ' + (+selMonth.slice(0, 4) + 543) + '</b><button onclick="shiftMonth(1)"'
      + (selMonth >= curMonth ? ' disabled' : '') + '>›</button></div>';
  }
  function shiftMonth(k) {
    var y = +selMonth.slice(0, 4), m = +selMonth.slice(5, 7) + k;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    selMonth = y + '-' + ('0' + m).slice(-2);
    selDay = selMonth === curMonth ? todayIso() : selMonth + '-01';
    loadHistory();
  }
  function dayType(iso) {
    if (CAL.hol[iso]) return 'hol';
    if (CAL.work && CAL.work[iso]) return 'work';  // เสาร์ทำงาน (ประชุม/5ส)
    var d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
    return CAL.workdays.indexOf(d.getDay()) >= 0 ? 'work' : 'off';
  }
  function renderHist(days, stale) {
    lastDays = days;
    var by = {}, total = 0, t = todayIso();
    days.forEach(function (x) { by[x.date] = x; total += x.items.length; });
    if (selMonth === curMonth) setStatus(by[t] && by[t].items.length ? by[t] : null);
    var y = +selMonth.slice(0, 4), m = +selMonth.slice(5, 7);
    var first = new Date(y, m - 1, 1).getDay(), nd = new Date(y, m, 0).getDate(), cells = '';
    for (var i = 0; i < first; i++) cells += '<div></div>';
    for (var dd = 1; dd <= nd; dd++) {
      var iso = selMonth + '-' + ('0' + dd).slice(-2), ty = dayType(iso), x = by[iso];
      var dots = '<i class="' + (ty === 'work' ? 'd-shift' : ty === 'hol' ? 'd-hol' : 'd-off') + '"></i>';
      if (x && x.items.length) dots += '<i class="' + (x.r && (x.r.half || x.r.forgot) ? 'd-bad'
        : x.r && (x.r.late || x.r.early) ? 'd-late' : x.items.length === 1 && ty === 'work' ? 'd-one' : 'd-in') + '"></i>';
      cells += '<div class="c' + (iso === selDay ? ' sel' : '') + (iso === t ? ' today' : '') + '" data-d="' + iso
        + '" onclick="pickDay(this.dataset.d)"><span>' + dd + '</span><div class="dots">' + dots + '</div></div>';
    }
    el('hist').innerHTML = monthBar()
      + (stale ? '<div class="muted" style="text-align:center">⟳ กำลังอัปเดต</div>' : '')
      + '<div class="cal"><div class="dw sun">อา</div><div class="dw">จ</div><div class="dw">อ</div><div class="dw">พ</div>'
      + '<div class="dw">พฤ</div><div class="dw">ศ</div><div class="dw">ส</div>' + cells + '</div>'
      + '<div class="legend"><span><i class="d-shift"></i>วันทำงาน</span><span><i class="d-in"></i>ตรงเวลา</span>'
      + '<span><i class="d-late"></i>สาย/ออกก่อน</span><span><i class="d-bad"></i>ขาดครึ่งวัน/ลืมบันทึก</span>'
      + '<span><i class="d-one"></i>บันทึกครั้งเดียว</span><span><i class="d-off"></i>เสาร์-อาทิตย์</span>'
      + '<span><i class="d-hol"></i>วันหยุด</span></div>'
      + '<div class="sum">' + monthLabel(selMonth) + ' · มาทำงาน <b>' + days.filter(function (x) { return x.items.length; }).length + '</b> วัน · กดรวม <b>'
      + total + '</b> ครั้ง' + monthSum(days) + '</div><div id="dayd"></div>';
    renderDay();
  }
  function monthSum(days) {  // สรุปทั้งเดือน: สายกี่ครั้ง รวมกี่นาที · OT รวม (สายรวมเกิน 150 นาที = ใบเตือนตามกฎบริษัท)
    var n = 0, m = 0, ot = 0, half = 0;
    days.forEach(function (x) { if (x.r) { if (x.r.late) { n++; m += x.r.late; } ot += x.r.ot || 0; if (x.r.half) half++; } });
    var s = '<br>สาย <b>' + n + '</b> ครั้ง (รวม ' + mtxt(m) + ')' + (m > 150 ? ' <span class="rt r">เกิน 150 นาที</span>' : '');
    if (half) s += ' · ขาดครึ่งวัน <b>' + half + '</b>';
    if (ot) s += ' · OT รวม <b>' + Math.floor(ot / 60) + ':' + ('0' + (ot % 60)).slice(-2) + '</b> ชม.';
    return s;
  }
  function pickDay(iso) { selDay = iso; renderHist(lastDays, false); }
  function renderDay() {
    var x = null, t = todayIso(), ty = dayType(selDay), p = selDay.split('-');
    lastDays.forEach(function (d) { if (d.date === selDay) x = d; });
    var html = '<div class="dh">' + (+p[2]) + ' ' + MONF[+p[1] - 1] + ' ' + (+p[0] + 543) + '</div>';
    html += ty === 'work'
      ? '<div class="tl"><i class="d-shift"></i><div><b>กะทำงาน</b>'
        + (CAL.work && CAL.work[selDay] ? ' <span class="muted">· เสาร์ทำงาน: ' + esc(CAL.work[selDay]) + '</span>' : '')
        + (x && x.r && x.r.field ? '<br>🚗 วันนี้ทำงานหน้างาน: ' + x.r['in'] + ' – ' + x.r.out
          : '<br>🕗 ' + CAL.start + ' – ' + CAL.end)
        + ' &nbsp;·&nbsp; 🍴 พัก ' + CAL.brk + '</div></div>'
      : '<div class="tl"><i class="' + (ty === 'hol' ? 'd-hol' : 'd-off') + '"></i><div><b>'
        + (ty === 'hol' ? 'วันหยุด · ' + esc(CAL.hol[selDay]) : 'วันหยุด (เสาร์-อาทิตย์)') + '</b></div></div>';
    if (x) {
      var n = x.items.length;
      x.items.forEach(function (it, i) {
        var lab = i === 0 ? 'บันทึกเข้า' : (i === n - 1 ? 'บันทึกออก' : 'ระหว่างวัน');
        html += '<div class="tl"><i class="d-in"></i><div><b>' + lab + '</b> ' + hm(it.t) + ' น.'
          + (it.dup > 1 ? ' <span class="muted">(กดซ้ำ ' + it.dup + ')</span>' : '')
          + phBtn(it)
          + '<br><span class="pl">' + (it.fix ? '✏️ ' + esc(it.place) : it.gps ? '📍 ' + esc(it.place || 'มีพิกัด') : '⚠️ ไม่มีพิกัด') + '</span></div></div>';
      });
      if (n === 1 && ty === 'work' && selDay === t) {
        html += '<div class="tl"><i class="d-one"></i><div><b>รอบันทึกออก</b></div></div>';
      }
      var tags = resultTags(x.r);
      if (tags) html += '<div class="tl"><i class="d-shift"></i><div><b>' + (selDay === t ? 'ผลวันนี้' : 'ผลของวันนี้ตามกฎบริษัท') + '</b><br>' + tags + '</div></div>';
      if (x.req && x.req.length) html += '<div class="tl"><i class="d-late"></i><div><b>คำขอแก้ไขเวลา</b><br>' + reqTags(x.req) + '</div></div>';
    } else if (ty === 'work') {
      html += '<div class="tl"><i class="d-none"></i><div class="muted">'
        + (selDay > t ? 'ยังไม่ถึงวันนี้' : 'ไม่มีการกดจากแอป Kosin ในวันนี้') + '</div></div>';
    }
    if (ty === 'work' && selDay <= t) {  // ลืมกดเข้า/ออก → ขอแก้ไขเวลา (HR อนุมัติ)
      html += '<button class="fixbtn" onclick="fxOpen(\'' + selDay + '\')">✏️ ลืมกด? ขอแก้ไขเวลา (แนบรูปหลักฐาน)</button>';
    }
    el('dayd').innerHTML = '<div class="day">' + html + '</div>';
  }
  showWho();
  loadHistory();
</script></body></html>
